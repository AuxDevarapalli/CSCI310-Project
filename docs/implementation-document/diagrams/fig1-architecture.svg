<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1203 796" width="1203" height="796" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/></marker></defs>
<rect x="0" y="0" width="1203" height="796" fill="#FFFFFF"/>
<text x="601.3" y="18" font-size="12.5" font-weight="bold" text-anchor="middle">Figure 1 (revises 2.2 Figure 1): SplitSmart block diagram, the same six components in three layers plus the new application class</text>
<rect x="6.0" y="34.0" width="813.8" height="712.0" rx="6" fill="#FFFFFF" stroke="#777777" stroke-width="1"/><text x="14.0" y="48.0" font-size="10.5" font-weight="bold" fill="#333333">Android phone: SplitSmart app (Java, package com.team04.splitsmart)</text>
<rect x="16.0" y="154.0" width="759.8" height="139.0" rx="6" fill="#FAFAFA" stroke="#777777" stroke-width="1" stroke-dasharray="5,3"/><text x="24.0" y="168.0" font-size="10" font-weight="bold" fill="#333333">Presentation layer (MVVM)</text>
<rect x="16.0" y="323.0" width="759.8" height="214.0" rx="6" fill="#FAFAFA" stroke="#777777" stroke-width="1" stroke-dasharray="5,3"/><text x="24.0" y="337.0" font-size="10" font-weight="bold" fill="#333333">Business logic layer (plain Java, no Android or Firebase imports, JUnit tested)</text>
<rect x="28.0" y="345.0" width="735.8" height="180.0" rx="6" fill="#FFFFFF" stroke="#777777" stroke-width="1"/><text x="36.0" y="359.0" font-size="10.5" font-weight="bold" fill="#333333">C3 Business Logic and Model</text>
<rect x="16.0" y="567.0" width="759.8" height="113.0" rx="6" fill="#FAFAFA" stroke="#777777" stroke-width="1" stroke-dasharray="5,3"/><text x="24.0" y="581.0" font-size="10" font-weight="bold" fill="#333333">Data access layer (repository pattern)</text>
<rect x="947.8" y="34.0" width="248.8" height="712.0" rx="6" fill="#FFFFFF" stroke="#777777" stroke-width="1"/><text x="955.8" y="48.0" font-size="10.5" font-weight="bold" fill="#333333">Firebase cloud backend</text>
<rect x="495.6" y="58.0" width="200.9" height="66.0" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
<text x="596.1" y="75.0" font-size="10.0" text-anchor="middle" font-weight="bold">SplitSmartApp</text>
<text x="596.1" y="88.0" font-size="10.0" text-anchor="middle" font-weight="bold">new: Application class that builds the</text>
<text x="596.1" y="101.0" font-size="10.0" text-anchor="middle" font-weight="bold">AppContainer once and checks that</text>
<text x="596.1" y="114.0" font-size="10.0" text-anchor="middle" font-weight="bold">Firebase is configured (A1)</text>
<rect x="43.3" y="176.0" width="280.4" height="105.0" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
<text x="183.5" y="193.0" font-size="10.0" text-anchor="middle" font-weight="bold">C1 UI Views</text>
<text x="183.5" y="206.0" font-size="10.0" text-anchor="middle">Activities, 4 tab fragments, dialogs, adapters</text>
<text x="183.5" y="219.0" font-size="10.0" text-anchor="middle" font-weight="bold">new: BaseActivity, BaseFragment, MembersFragment,</text>
<text x="183.5" y="232.0" font-size="10.0" text-anchor="middle" font-weight="bold">GroupPagerAdapter, Refreshable, UiUtils (D1)</text>
<text x="183.5" y="245.0" font-size="10.0" text-anchor="middle" font-weight="bold">changed: screens pass ids in Intents, not objects (D2)</text>
<text x="183.5" y="258.0" font-size="10.0" text-anchor="middle" font-weight="bold">changed: settlement form: “I paid” / “I was paid” (R9)</text>
<text x="183.5" y="271.0" font-size="10.0" text-anchor="middle" font-weight="bold">new: Match case chip in the history (R13)</text>
<rect x="443.7" y="176.0" width="304.8" height="105.0" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
<text x="596.1" y="193.0" font-size="10.0" text-anchor="middle" font-weight="bold">C2 ViewModels</text>
<text x="596.1" y="206.0" font-size="10.0" text-anchor="middle">Screen state as LiveData; permission checks</text>
<text x="596.1" y="219.0" font-size="10.0" text-anchor="middle" font-weight="bold">new: Event&lt;T&gt; one-time messages, form-state classes (D3)</text>
<text x="596.1" y="232.0" font-size="10.0" text-anchor="middle" font-weight="bold">new: own the live-update Subscriptions (A5)</text>
<text x="596.1" y="245.0" font-size="10.0" text-anchor="middle" font-weight="bold">changed: AppContainer injected, no longer a singleton (A1)</text>
<text x="596.1" y="258.0" font-size="10.0" text-anchor="middle" font-weight="bold">changed: settlements recorded from either side (R9)</text>
<rect x="40.0" y="367.0" width="172.6" height="79.0" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
<text x="126.3" y="384.0" font-size="10.0" text-anchor="middle" font-weight="bold">Validation and formatting</text>
<text x="126.3" y="397.0" font-size="10.0" text-anchor="middle">InputValidator, Money,</text>
<text x="126.3" y="410.0" font-size="10.0" text-anchor="middle">ValidationResult, DateProvider</text>
<text x="126.3" y="423.0" font-size="10.0" text-anchor="middle" font-weight="bold">changed: more rules and limits,</text>
<text x="126.3" y="436.0" font-size="10.0" text-anchor="middle" font-weight="bold">month arithmetic (D4)</text>
<rect x="226.6" y="367.0" width="127.0" height="79.0" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
<text x="290.1" y="384.0" font-size="10.0" text-anchor="middle" font-weight="bold">Split engine</text>
<text x="290.1" y="397.0" font-size="10.0" text-anchor="middle">SplitCalculator: equal /</text>
<text x="290.1" y="410.0" font-size="10.0" text-anchor="middle">exact / percentage,</text>
<text x="290.1" y="423.0" font-size="10.0" text-anchor="middle">FR 3.5 rounding</text>
<text x="290.1" y="436.0" font-size="10.0" text-anchor="middle" font-weight="bold">changed: 0% rule (R4)</text>
<rect x="367.6" y="367.0" width="193.1" height="79.0" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
<text x="464.2" y="384.0" font-size="10.0" text-anchor="middle" font-weight="bold">Balance engine</text>
<text x="464.2" y="397.0" font-size="10.0" text-anchor="middle">BalanceCalculator,</text>
<text x="464.2" y="410.0" font-size="10.0" text-anchor="middle">BalanceSummary, PairBalance</text>
<text x="464.2" y="423.0" font-size="10.0" text-anchor="middle" font-weight="bold">new: amountOwed (settlement cap),</text>
<text x="464.2" y="436.0" font-size="10.0" text-anchor="middle" font-weight="bold">computeTotals (D4)</text>
<rect x="574.8" y="367.0" width="177.0" height="79.0" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
<text x="663.3" y="384.0" font-size="10.0" text-anchor="middle" font-weight="bold">History and summary engine</text>
<text x="663.3" y="397.0" font-size="10.0" text-anchor="middle">HistoryFilter, HistoryQuery,</text>
<text x="663.3" y="410.0" font-size="10.0" text-anchor="middle">SummaryCalculator</text>
<text x="663.3" y="423.0" font-size="10.0" text-anchor="middle" font-weight="bold">new: monthsWithExpenses (D4),</text>
<text x="663.3" y="436.0" font-size="10.0" text-anchor="middle" font-weight="bold">Match case option (R13)</text>
<rect x="40.0" y="460.0" width="711.8" height="53.0" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
<text x="395.9" y="477.0" font-size="10.0" text-anchor="middle" font-weight="bold">Domain model (shared by every layer)</text>
<text x="395.9" y="490.0" font-size="10.0" text-anchor="middle">User, Group, Transaction, Expense, Settlement, Share, enums; money as long cents</text>
<text x="395.9" y="503.0" font-size="10.0" text-anchor="middle" font-weight="bold">changed: all model objects are immutable; with...() copies replace the setters (D5)</text>
<rect x="175.7" y="589.0" width="440.4" height="79.0" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
<text x="395.9" y="606.0" font-size="10.0" text-anchor="middle" font-weight="bold">C4 Repositories: the only classes that import the Firebase SDK</text>
<text x="395.9" y="619.0" font-size="10.0" text-anchor="middle">AuthRepository, UserRepository, GroupRepository, TransactionRepository, DataCallback&lt;T&gt;</text>
<text x="395.9" y="632.0" font-size="10.0" text-anchor="middle" font-weight="bold">new: FirestoreMapper (schema in one place), FirebaseErrors / RepositoryException (A2)</text>
<text x="395.9" y="645.0" font-size="10.0" text-anchor="middle" font-weight="bold">new: Subscription for snapshot listeners (A5); removeMember, transferOwnership (A6)</text>
<text x="395.9" y="658.0" font-size="10.0" text-anchor="middle" font-weight="bold">changed: registration order (A3); batched group delete (D6)</text>
<rect x="186.8" y="694.0" width="418.3" height="40.0" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1" stroke-dasharray="5,3"/>
<text x="395.9" y="711.0" font-size="10.0" text-anchor="middle">Other members’ phones run the same app and read and write the same database</text>
<text x="395.9" y="724.0" font-size="10.0" text-anchor="middle" font-style="italic" fill="#555555">(NFR 3: a member’s change is visible to the others on refresh, and is now also pushed live)</text>
<rect x="959.8" y="176.0" width="224.8" height="66.0" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
<text x="1072.2" y="193.0" font-size="10.0" text-anchor="middle" font-weight="bold">C5 Firebase Authentication</text>
<text x="1072.2" y="206.0" font-size="10.0" text-anchor="middle">Email + password accounts,</text>
<text x="1072.2" y="219.0" font-size="10.0" text-anchor="middle">passwords stored only as hashes (NFR 4),</text>
<text x="1072.2" y="232.0" font-size="10.0" text-anchor="middle">login session. Unchanged.</text>
<rect x="959.8" y="511.0" width="224.8" height="183.0" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="1"/>
<text x="1072.2" y="528.0" font-size="10.0" text-anchor="middle" font-weight="bold">C6 Cloud Firestore</text>
<text x="1072.2" y="541.0" font-size="10.0" text-anchor="middle">Collections: users, uscIds, groups,</text>
<text x="1072.2" y="554.0" font-size="10.0" text-anchor="middle">groups/{groupId}/transactions</text>
<text x="1072.2" y="567.0" font-size="10.0" text-anchor="middle" font-weight="bold">changed: users + createdAt; transactions</text>
<text x="1072.2" y="580.0" font-size="10.0" text-anchor="middle" font-weight="bold">+ updatedAt, + participantIds (5.4)</text>
<text x="1072.2" y="593.0" font-size="10.0" text-anchor="middle" font-weight="bold">changed: rules also validate contents, and</text>
<text x="1072.2" y="606.0" font-size="10.0" text-anchor="middle" font-weight="bold">the owner may delete a whole group (A4)</text>
<text x="1072.2" y="619.0" font-size="10.0" text-anchor="middle" font-weight="bold">changed: a settlement may be recorded by</text>
<text x="1072.2" y="632.0" font-size="10.0" text-anchor="middle" font-weight="bold">its payer or its receiver (R9)</text>
<text x="1072.2" y="645.0" font-size="10.0" text-anchor="middle" font-weight="bold">changed: leave / remove / transfer</text>
<text x="1072.2" y="658.0" font-size="10.0" text-anchor="middle" font-weight="bold">ownership (A6)</text>
<text x="1072.2" y="671.0" font-size="10.0" text-anchor="middle" font-weight="bold">new: snapshot listeners push changes</text>
<text x="1072.2" y="684.0" font-size="10.0" text-anchor="middle" font-weight="bold">to open screens (A5)</text>
<path d="M 596.1 124.0 L 596.1 176.0" fill="none" stroke="#333333" stroke-width="1.1" marker-end="url(#arrow)"/>
<text x="588.1" y="141.0" font-size="9" text-anchor="end" fill="#333333">builds AppContainer</text>
<path d="M 323.7 228.5 L 443.7 228.5" fill="none" stroke="#333333" stroke-width="1.1" marker-end="url(#arrow)"/>
<text x="383.7" y="212.5" font-size="9" text-anchor="middle" fill="#333333">observes LiveData,</text>
<text x="383.7" y="223.5" font-size="9" text-anchor="middle" fill="#333333">forwards input</text>
<path d="M 556.1 281.0 L 556.1 345.0" fill="none" stroke="#333333" stroke-width="1.1" marker-end="url(#arrow)"/>
<text x="550.1" y="316.0" font-size="9" text-anchor="end" fill="#333333">validate, split, balances, filters</text>
<path d="M 748.5 249.5 L 797.8 249.5 L 797.8 601.0 L 616.1 601.0" fill="none" stroke="#333333" stroke-width="1.1" marker-end="url(#arrow)"/>
<text x="791.8" y="555.0" font-size="9" text-anchor="end" fill="#333333">calls; every result comes back through a DataCallback&lt;T&gt; (asynchronous)</text>
<path d="M 616.1 622.2 L 871.8 622.2 L 871.8 209.0 L 959.8 209.0" fill="none" stroke="#333333" stroke-width="1.1" marker-end="url(#arrow)"/>
<text x="877.8" y="223.0" font-size="9" text-anchor="start" fill="#333333">register, log in,</text>
<text x="877.8" y="234.0" font-size="9" text-anchor="start" fill="#333333">log out</text>
<path d="M 616.1 641.1 L 959.8 641.1" fill="none" stroke="#333333" stroke-width="1.1" marker-end="url(#arrow)"/>
<text x="889.8" y="637.1" font-size="9" text-anchor="middle" fill="#333333">get / set / update / batch</text>
<path d="M 959.8 660.1 L 616.1 660.1" fill="none" stroke="#333333" stroke-width="1.1" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
<text x="889.8" y="671.1" font-size="9" text-anchor="middle" fill="#333333" font-weight="bold">snapshot listener →</text>
<text x="889.8" y="682.1" font-size="9" text-anchor="middle" fill="#333333" font-weight="bold">Subscription (new, A5)</text>
<path d="M 1072.2 694.0 L 1072.2 714.0 L 605.0 714.0" fill="none" stroke="#333333" stroke-width="1.1" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
<text x="889.8" y="699.0" font-size="9" text-anchor="middle" fill="#333333" font-weight="bold">changes pushed to</text>
<text x="889.8" y="710.0" font-size="9" text-anchor="middle" fill="#333333" font-weight="bold">other phones (new)</text>
<text x="6.0" y="762.0" font-size="9" text-anchor="start" fill="#333333">Solid arrows: calls between components (every repository call returns through a DataCallback). Dashed arrows: live updates (new, A5).</text>
<text x="6.0" y="773.0" font-size="9" text-anchor="start" fill="#333333">Component numbers C1 to C6 are the ones from the Project 2.2 design; their responsibilities and the layer rules are unchanged.</text>
<text x="6.0" y="784.0" font-size="9" text-anchor="start" fill="#333333">Inside a box, bold lines marked “new:” or “changed:” (and their continuation lines) are the departures from Project 2.2; plain lines are unchanged.</text>
</svg>